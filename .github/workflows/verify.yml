# Runs the public recompute chain in RECOMPUTE.md on every push and pull request, read-only.
# It proves the record reproduces from this tree: the seal, the 4x4 matrix from the shipped
# panels, the regenerated tables, every figure value, and the paper's statistics sentences.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt

      - name: "Step 3: the seal, on the checkout"
        run: sha256sum -c SHA256SUMS

      - name: "Step 3: the seal, on the timestamped zip"
        run: |
          mkdir -p "$RUNNER_TEMP/zip"
          unzip -q gcc-validation-data.zip -d "$RUNNER_TEMP/zip" || [ $? -eq 1 ]
          cp SHA256SUMS "$RUNNER_TEMP/zip/"
          cd "$RUNNER_TEMP/zip" && sha256sum -c SHA256SUMS

      - name: "Step 1: the 4x4 matrix, rebuilt from the shipped panels"
        run: |
          python tools/tri_combine.py \
            --panel "GPT:openai:02_data/raw/panel_tri_cookGPT_4judge.json" \
            --panel "Opus:claude:02_data/raw/panel_tri_cookOpus_4judge.json" \
            --panel "Gemini:gemini:02_data/raw/panel_tri_cookGemini_4judge.json" \
            --panel "Grok:xai:02_data/raw/panel_tri_cookGrok.json" \
            --out "$RUNNER_TEMP/my_4x4.json"
          # Every value must match the shipped matrix. The only field allowed to differ is the
          # input path each panel was read from, which the shipped file recorded as it was built.
          python - "$RUNNER_TEMP/my_4x4.json" 02_data/raw/tri_final_4x4.json <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:3])
          for side in (a, b):
              for cook in side.get("cooks", {}).values():
                  cook.pop("panel", None)
          if a != b:
              sys.exit("the rebuilt 4x4 matrix differs from 02_data/raw/tri_final_4x4.json")
          print("the rebuilt 4x4 matrix matches the shipped one in every value")
          PY

      - name: "Step 4: the series and dampening tables, regenerated byte for byte"
        run: |
          cd 02_data/scripts && python extract_series_4x4.py
          cd "$GITHUB_WORKSPACE" && git diff --exit-code -- 02_data

      - name: "Step 5: every figure value against the record"
        run: cd figures && python verify_figure_numbers.py

      - name: "Step 6: the statistics sentences in section 6.6"
        run: cd 02_data/scripts && python stats_checks.py
